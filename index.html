<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEXLE</title>
    <script src="index.js" defer></script>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: #202020;
            color: #eee;
            text-align: center;
            padding: 2rem 1rem;
        }

        h1 {
            margin: 0 0 0.25rem;
            font-size: 2rem;
            letter-spacing: 0.1em;
        }

        .subheader {
            color: #888;
            font-size: 0.85rem;
        }

        #hint {
            color: #888;
            font-size: 0.85rem;
        }

        #copy {
            color: #888;
            font-size: 0.85rem;
            text-decoration: underline;
        }

        hr {
            border: none;
            border-top: 1px solid #444;
            margin: 1.5rem auto;
            max-width: 300px;
        }

        .Row {
            display: flex;
            justify-content: center;
            gap: 0.4rem;
            margin-bottom: 0.4rem;
        }

        .Box {
            width: 3rem;
            height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #555;
            border-radius: 4px;
            font-size: 1.25rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .Box.correct { background: #ED3140; border-color: #ED3140; }

        .Keyboard {
            margin-top: 2rem;
        }

        .KeyboardRow {
            display: flex;
            justify-content: center;
            gap: 0.3rem;
            margin-bottom: 0.4rem;
        }

        .Key {
            min-width: 2rem;
            padding: 0.6rem 0.5rem;
            background: #333;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            touch-action: manipulation;
        }

        .hidden { display: none !important; }

        dialog#results {
            border: none;
            border-radius: 0.5rem;
            padding: 2rem 1.5rem;
            max-width: 90vw;
            background-color: #2a2a2a;
            color: #eee;
        }

        dialog#results::backdrop {
            background: rgba(0, 0, 0, 0.6);
        }

        .modal-content {
            position: relative;
            text-align: center;
        }

        .modal-close {
            position: absolute;
            top: -0.5rem;
            right: -0.5rem;
            background: none;
            border: none;
            color: #eee;
            font-size: 1.2rem;
            cursor: pointer;
        }

        #table {
            white-space: pre-line;
        }

        .word-transition {
            font-size: 1.3rem;
            text-transform: uppercase;
            margin: 0.5rem 0 1.5rem;
        }

        .link-btn {
            background: none;
            border: none;
            color: #6cb4ff;
            text-decoration: underline;
            cursor: pointer;
            font: inherit;
        }

        .copy-feedback {
            display: block;
            font-size: 0.85rem;
            color: #4ade80;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>

<h1>SEXLE</h1>
<p class="subheader">#1</p>
<p id="hint" class="hidden">PLACEHOLDER</p>
<hr>

<div id="board"></div>


<div class="Keyboard">
    <div class="KeyboardRow">
        <div class="Key" data-key="Q">Q</div>
        <div class="Key" data-key="W">W</div>
        <div class="Key" data-key="E">E</div>
        <div class="Key" data-key="R">R</div>
        <div class="Key" data-key="T">T</div>
        <div class="Key" data-key="Y">Y</div>
        <div class="Key" data-key="U">U</div>
        <div class="Key" data-key="I">I</div>
        <div class="Key" data-key="O">O</div>
        <div class="Key" data-key="P">P</div>
    </div>
    <div class="KeyboardRow">
        <div class="Key" data-key="A">A</div>
        <div class="Key" data-key="S">S</div>
        <div class="Key" data-key="D">D</div>
        <div class="Key" data-key="F">F</div>
        <div class="Key" data-key="G">G</div>
        <div class="Key" data-key="H">H</div>
        <div class="Key" data-key="J">J</div>
        <div class="Key" data-key="K">K</div>
        <div class="Key" data-key="L">L</div>
    </div>
    <div class="KeyboardRow">
        <div class="Key" data-key="Enter">Enter</div>
        <div class="Key" data-key="Z">Z</div>
        <div class="Key" data-key="X">X</div>
        <div class="Key" data-key="C">C</div>
        <div class="Key" data-key="V">V</div>
        <div class="Key" data-key="B">B</div>
        <div class="Key" data-key="N">N</div>
        <div class="Key" data-key="M">M</div>
        <div class="Key" data-key="⌫">⌫</div>
    </div>
</div>

<dialog id="results">
    <div class="modal-content">
        <button id="closeBtn" class="modal-close">✕</button>
        <h1 class="modal-title">Congratulations!</h1>
        <p id="wordTransition" class="word-transition">WHAM <span>to</span> POOP</p>
        <div class="modal-results">
            <p>You used <b id="guessCount">0 guesses.</b></p>
            <p>Best solution: <b id="bestCount">0 guesses.</b></p>
            <p>You have a streak of <b id="streak"></b></p>
            <p id="table">RESULTS TABLE</p>
            <button id="copyBtn" class="link-btn">Copy results</button>
            <span id="copyFeedback" class="copy-feedback"></span>
        </div>
    </div>
</dialog>

</body>

<script src="shake.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@3.0.3/tsparticles.confetti.bundle.min.js"></script>
<script src="solve.js"></script>

</html>
